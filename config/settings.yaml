# LinkedIn & WhatsApp Autonomous Job Outreach Settings

bot:
  name: "AutoCareer-Agent"
  version: "1.0.0"
  check_interval_minutes: 10 # Frequency of feed scans (in minutes)
  check_connections_interval_minutes: 15 # Frequency of accepted connection checks

search_queries:
  # Mechanical Engineering Freshers with Direct Contact
  - 'Mechanical fresher hiring WhatsApp'
  - 'Mechanical Engineering fresher contact number'
  - 'GET Mechanical Engineering fresher hiring'
  - 'Diploma Mechanical trainee WhatsApp'
  - 'Mechanical fresher 2026 2027 batch hiring'
  # UI/UX Designer Freshers with Direct Contact
  - 'UI UX Designer fresher hiring WhatsApp'
  - 'UI UX Designer intern contact number'
  - 'Junior UI UX designer hiring paid'
  # Web Development Freshers with Direct Contact
  - 'Web developer fresher hiring WhatsApp'
  - 'Frontend developer intern contact number'
  - 'Full stack developer fresher hiring WhatsApp'
  # AI & Prompt Engineering Freshers with Direct Contact
  - 'Prompt Engineer fresher hiring'
  - 'Generative AI intern fresher hiring WhatsApp'
  - 'AI ML engineer fresher trainee contact'

filters:
  strict_paid_only: true
  unpaid_blacklist_keywords:
    - "unpaid"
    - "no stipend"
    - "without stipend"
    - "free internship"
    - "volunteer"
    - "experience only"
    - "equity only"
    - "non-paid"
    - "un-paid"

rate_limits:
  max_connection_requests_per_day: 20
  max_direct_messages_per_day: 35
  max_comments_per_day: 25
  max_whatsapp_messages_per_day: 20
  min_delay_between_actions_seconds: 35
  max_delay_between_actions_seconds: 90

browser:
  headless: false # Set to false to inspect or debug; can be true for 24/7 background
  channel: "msedge" # Uses Microsoft Edge
  user_data_dir: "browser_data/edge_profile" # Persistent session for login preservation
  viewport:
    width: 1366
    height: 768
  slow_mo_ms: 100

channels:
  enable_linkedin_dm: false
  enable_linkedin_connect: false
  enable_linkedin_comment: false
  enable_whatsapp: false
