# LinkedIn & WhatsApp Autonomous Job Outreach Settings

bot:
  name: "AutoCareer-Agent"
  version: "1.0.0"
  check_interval_minutes: 10 # Frequency of feed scans (in minutes)
  check_connections_interval_minutes: 15 # Frequency of accepted connection checks

search_queries:
  - 'UI UX Designer hiring paid'
  - 'UI UX Designer fresher hiring'
  - 'Prompt Engineer hiring'
  - 'Prompt Engineer fresher paid'
  - 'Web Developer fresher hiring'
  - 'Mechanical fresher hiring 2027 batch'
  - 'Mechanical fresher hiring 2026 batch'
  - 'Mechanical fresher hiring 2028 batch'
  - 'Mechanical Engineering fresher backlogs allowed'
  - 'Mechanical fresher no minimum cgpa criteria'
  - 'Mechanical Engineer fresher no percentage criteria'
  - 'Mechanical Engineer fresher CTC LPA backlogs'
  - 'Mechanical Engineer internship stipend 2027'
  - 'Graduate Engineer Trainee Mechanical 2026 2027'
  - 'GET Mechanical Engineering fresher hiring'

filters:
  strict_paid_only: true
  unpaid_blacklist_keywords:
    - "unpaid"
    - "no stipend"
    - "without stipend"
    - "free internship"
    - "volunteer"
    - "experience only"
    - "equity only"
    - "non-paid"
    - "un-paid"

rate_limits:
  max_connection_requests_per_day: 20
  max_direct_messages_per_day: 35
  max_comments_per_day: 25
  max_whatsapp_messages_per_day: 20
  min_delay_between_actions_seconds: 35
  max_delay_between_actions_seconds: 90

browser:
  headless: false # Set to false to inspect or debug; can be true for 24/7 background
  channel: "msedge" # Uses Microsoft Edge
  user_data_dir: "browser_data/edge_profile" # Persistent session for login preservation
  viewport:
    width: 1366
    height: 768
  slow_mo_ms: 100

channels:
  enable_linkedin_dm: false
  enable_linkedin_connect: false
  enable_linkedin_comment: false
  enable_whatsapp: false
